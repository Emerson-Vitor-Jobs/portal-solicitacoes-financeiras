server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Sem versão do nginx nas respostas de erro.
    server_tokens off;

    # API na mesma origem do front: o cookie SameSite=Strict funciona sem CORS (DECISOES_FUNDACAO §8.3).
    # Headers de segurança (SECURITY.md). O nginx NÃO herda add_header do bloco `server` quando a location define
    # os seus, então cada location repete o conjunto que se aplica a ela.
    location /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Sem barra no fim: o caminho /api/... é repassado sem reescrita.
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        # SOBRESCREVE o X-Forwarded-For com o IP real da conexão, em vez de anexar o que o cliente
        # mandou. A API confia nesse header só quando a requisição vem do IP deste container (§14.6).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota que não é arquivo cai no index.html (o React Router resolve no navegador).
    location / {
        # CSP da SPA: só recursos da própria origem. `style-src 'unsafe-inline'` é exigido pelos estilos inline do
        # Mantine; scripts continuam restritos a arquivos da origem (nenhum script inline).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
